<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="style.css">
    <script src="index.js"></script>
    <title>GravOS</title>
  </head>

  <body>
    <div class="window" id="welcome" style="left: 30%; width: 40%; top: 20%; height: 40%;">
      <div class="header" id="welcomeheader">
        <p>Welcome</p>
        <div id="welcomeclose" style="cursor: pointer;" class="closeicon">X</div>
      </div>
      <div class="content">
        <div>
          <img src="./assisstant.gif">
          <p class="typewriter" id="dialoguebox">
            Welcome to GravOS! This is a webpage that lets you take a look at the operating system I run on.
          </p>
        </div>
        <div class="button" id="next">Next</div>
      </div>
    </div>
    <div class="topbar">
      <div class="apps">
        <p class="app" id="welcomeopen">Welcome</p>
      </div>
      <p style="margin-right: 16px; margin-left: 16px">GravOS</p>
      <p style="margin-right: 16px; margin-left: 16px" id="time">5:41 pm</p>
    </div>
  </body>
    
</html>
